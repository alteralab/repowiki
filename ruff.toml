# 프로젝트 ruff 설정 — altera-rules 기반 설정을 상속하고 이 저장소의 출력 층과
# 동결 경로만 덧붙인다(rules-install 4단계). 커밋 훅도 이 파일로 돈다.
extend = "/Users/angyojun/workspace/altera-rules/gates/ruff/base.toml"

# 명시적으로 전달된 파일에도 exclude를 적용한다(커밋 훅은 파일 목록을 넘긴다).
force-exclude = true
extend-exclude = ["docs/reports/research", "docs/plan-history", ".venv", "site"]

[lint.per-file-ignores]
"src/repowiki/cli.py" = ["T201", "T203"]
"scripts/**" = ["T201", "T203"]
"evals/**" = ["T201", "T203"]
