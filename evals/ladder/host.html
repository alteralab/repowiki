<!doctype html>
<!-- 가독성 사다리 측정용 렌더 페이지. 로컬 node_modules의 ESM 번들만 쓴다(외부 요청 0). -->
<html>
  <!-- 글꼴은 사이트와 같아야 한다(site-template/app/global.css 의 --font-sans). Mermaid 기본
       글꼴로 재면 같은 그림이 사이트에서 더 넓다 — AREA-streams 가 사다리 통과 뒤 사이트에서
       977px 로 넘쳤다(2026-09-10). 사이트는 fontFamily: inherit 로 본문 글꼴을 물려받는다. -->
  <body style="margin:0; font-family: 'Pretendard Variable', Pretendard, -apple-system, BlinkMacSystemFont, 'Apple SD Gothic Neo', 'Segoe UI', 'Malgun Gothic', 'Noto Sans KR', Roboto, 'Helvetica Neue', Arial, sans-serif">
    <div id="host" style="width:820px"></div>
    <script type="module">
      import mermaid from '../../node_modules/mermaid/dist/mermaid.esm.min.mjs';
      import elkLayouts from '../../node_modules/@mermaid-js/layout-elk/dist/mermaid-layout-elk.esm.min.mjs';
      mermaid.registerLayoutLoaders(elkLayouts);
      mermaid.initialize({ startOnLoad: false, securityLevel: 'loose', suppressErrorRendering: true, fontFamily: 'inherit' });
      window.mermaid = mermaid;
      window.__ready = true;
    </script>
  </body>
</html>
