# 프로젝트 의존 선언. 정확한 버전 고정은 uv.lock이 소유한다(PLAN §12 1).
# 런타임 직접 의존은 PLAN §8의 상한(파이썬 12, 네이티브 휠 15) 안에 있어야 하고,
# 추가는 §8의 검사 목록 여덟 항목을 통과해야 한다.
[project]
name = "repowiki"
version = "0.0.0"
requires-python = ">=3.12"
dependencies = [
    "ast-grep-cli>=0.45.1",          # 심볼, import, 진입점, def/ref 태그, HCL 속성 스팬
    "networkx>=3.6",                 # PageRank, HITS, SCC, Louvain
    "pydantic>=2.13",                # 상태, 출력 스키마, frontmatter 정본
    "PyYAML>=6.0.3",                 # compose_all 마크 기반 YAML 스팬
    "python-hcl2>=8.1.4",            # Terraform 블록과 속성 스팬
    "dockerfile-parse>=2.0.1",       # Dockerfile 스팬
    "langgraph>=1.2",                # 조율 그래프 (사용자 결정 2026-09-09)
    "langgraph-checkpoint-sqlite>=3.1",
    "langchain-core>=1.6",
]

[project.optional-dependencies]
# API 드라이버를 쓰는 배치만 설치한다. 기본 경로는 Claude Code 세션 드라이버다(PLAN §4).
api = ["anthropic>=1.4"]
# Terraform 평가 그래프 스파이크(PLAN §3, Phase 2b 통과 전에는 기본 락 밖).
terraform-eval = ["tfparse>=0.6.21"]
# 평가 전용이며 런타임 SBOM 밖이다(PLAN §8). Leiden 도전자와 군집 비교 지표.
# ARI 같은 표준 지표는 직접 만들지 않는다(C-LIB-1).
evals = ["scikit-network>=0.33", "scikit-learn>=1.7"]

[project.scripts]
repowiki = "repowiki.cli:main"

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "pytest-repeat>=0.9",
    "mutmut>=3",
    "pre-commit>=4",
    "import-linter>=2.15",
    "ruff>=0.14",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/repowiki"]

[tool.ruff]
# 조항 귀속 룰의 정본. 소비 측은 이 상속 위에만 덧붙인다(rules-install 4단계).
extend = "/Users/angyojun/workspace/altera-rules/gates/ruff/base.toml"
# 리서치 스크립트는 실측 증거의 일부라 동결한다. 제품 코드가 아니다.
extend-exclude = ["docs/reports/research", "docs/plan-history", ".venv", "site"]

[tool.ruff.lint.per-file-ignores]
# 출력 층 선언(PLAN §2.2): 종료 상태와 표준 출력이 일인 자리.
"src/repowiki/cli.py" = ["T201", "T203"]
"scripts/**" = ["T201", "T203"]
"evals/**" = ["T201", "T203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.importlinter]
root_package = "repowiki"
include_external_packages = true

# 계약 1 — 계층. 위에서 아래로만 부른다(PLAN §2.2).
[[tool.importlinter.contracts]]
name = "계층 순서"
type = "layers"
# write 층은 Phase 3(LLM 층)에서 생긴다. 없는 모듈을 계약에 적으면 계약이 실패한다.
layers = ["repowiki.cli", "repowiki.pipeline", "repowiki.analyze | repowiki.gate | repowiki.bundle", "repowiki.adapters"]

# 계약 2 — 형제 독립. analyze, write, gate, bundle은 서로를 부르지 않는다.
[[tool.importlinter.contracts]]
name = "형제 독립"
type = "independence"
modules = ["repowiki.analyze", "repowiki.gate", "repowiki.bundle"]

# 계약 3 — 서드파티는 adapters 안에서만. adapters 파일 목록이 곧 서드파티 목록이다(PLAN §8 2).
[[tool.importlinter.contracts]]
name = "서드파티 격리"
type = "forbidden"
source_modules = ["repowiki.pipeline", "repowiki.analyze", "repowiki.gate", "repowiki.bundle"]
forbidden_modules = ["subprocess", "anthropic", "urllib", "http", "hcl2", "dockerfile_parse", "httpx", "httpx2", "requests"]
# 어댑터를 거친 간접 임포트는 계약이 허용하는 경로다. 금지는 직접 임포트에만 건다.
allow_indirect_imports = true
