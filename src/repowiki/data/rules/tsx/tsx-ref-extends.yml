id: tsx-ref-extends
language: tsx
message: ref.extends
# 클래스와 인터페이스의 상속 자리는 노드가 다르다. 클래스 쪽은 `extends_clause`의
# `identifier`이고 인터페이스 쪽은 `extends_type_clause`의 `type_identifier`다.
# 하나로 묶어 두지 않으면 인터페이스 계층이 통째로 빠진다(2026-09-09 AST 실측).
rule:
  any:
    - {kind: identifier, inside: {kind: extends_clause}}
    - {kind: type_identifier, inside: {kind: extends_type_clause, stopBy: end}}
  all:
    # 제네릭 인자와 타입 매개변수 안쪽은 잡지 않는다. `implements I<T>`의 `T`는 그
    # 타입의 매개변수이지 실제 타입이 아니고, 저장소에 우연히 같은 이름의 클래스가 있으면
    # 없는 엣지가 사실이 된다(2026-09-09 Codex 리뷰가 실제 거짓 엣지를 재현했다).
    # 제네릭 인자 자체의 관계가 필요하면 그것은 따로 낼 일이지 여기서 섞을 것이 아니다.
    - not: {inside: {kind: type_arguments, stopBy: end}}
    - not: {inside: {kind: type_parameters, stopBy: end}}
