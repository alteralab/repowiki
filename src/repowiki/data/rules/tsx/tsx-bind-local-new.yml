id: tsx-bind-local-new
language: tsx
message: bind.local
# 타입 표기가 없고 `new T()`로 초기화한 지역 변수. TypeScript는 표기가 선택이라
# 이 자리가 없으면 지역 변수 대부분이 스코프에 안 들어온다.
# 표기가 있으면 위의 룰이 이미 잡으므로 여기서는 표기 없는 것만 본다.
rule:
  kind: variable_declarator
  all:
    - has: {field: name, kind: identifier, pattern: $NAME}
    - has: {field: value, kind: new_expression, has: {field: constructor, pattern: $TYPE}}
    - not: {has: {field: type, kind: type_annotation}}
