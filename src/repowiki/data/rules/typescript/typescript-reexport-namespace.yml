id: typescript-reexport-namespace
language: typescript
message: reexport.namespace
# `export * as ns from "./x"`. 이름 하나로 묶여 나가므로 개별 이름을 따라가지 않는다.
rule:
  kind: export_statement
  all:
    - has: {field: source, pattern: $SOURCE}
    - has: {kind: namespace_export, has: {kind: identifier, pattern: $NAME}}
