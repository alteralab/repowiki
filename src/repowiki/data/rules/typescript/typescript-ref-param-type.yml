id: typescript-ref-param-type
language: typescript
message: ref.param_type
# 선택 파라미터(`p?: T`)는 노드 종류가 다르다. `any`는 `inside` 바깥에 둔다 —
# `inside` 안의 갈래에는 `stopBy`를 붙일 수 없다(ast-grep 0.45.3).
rule:
  kind: type_identifier
  any:
    - {inside: {kind: required_parameter, stopBy: end}}
    - {inside: {kind: optional_parameter, stopBy: end}}
  all:
    # 제네릭 인자와 타입 매개변수 안쪽은 잡지 않는다. `implements I<T>`의 `T`는 그
    # 타입의 매개변수이지 실제 타입이 아니고, 저장소에 우연히 같은 이름의 클래스가 있으면
    # 없는 엣지가 사실이 된다(2026-09-09 Codex 리뷰가 실제 거짓 엣지를 재현했다).
    # 제네릭 인자 자체의 관계가 필요하면 그것은 따로 낼 일이지 여기서 섞을 것이 아니다.
    - not: {inside: {kind: type_arguments, stopBy: end}}
    - not: {inside: {kind: type_parameters, stopBy: end}}
