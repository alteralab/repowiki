id: typescript-bind-call
language: typescript
message: bind.call
# 수신자가 있는 호출. 수신자 이름을 스코프에서 풀어야 대상 타입이 정해진다.
# 데코레이터는 뺀다 — `typescript-bind-call-bare`와 같은 이유다.
rule:
  kind: call_expression
  all:
    - has:
        field: function
        kind: member_expression
        all:
          - has: {field: object, pattern: $RECV}
          - has: {field: property, kind: property_identifier, pattern: $NAME}
    - not: {inside: {kind: decorator}}
