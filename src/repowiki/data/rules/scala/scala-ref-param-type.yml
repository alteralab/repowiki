id: scala-ref-param-type
language: scala
message: ref.param_type
# 메서드 파라미터와 클래스 파라미터의 타입. 스칼라는 생성자 인자가 클래스 파라미터라
# 둘을 함께 봐야 의존이 드러난다.
rule:
  kind: type_identifier
  any:
    - {inside: {kind: parameter, field: type}}
    - {inside: {kind: class_parameter, field: type}}
    - {inside: {kind: generic_type, field: type, inside: {kind: parameter, field: type}}}
    - {inside: {kind: generic_type, field: type, inside: {kind: class_parameter, field: type}}}
