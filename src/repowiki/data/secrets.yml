# 값을 가려야 하는 설정 키(SPEC 자격 증명 마스킹). 도메인 사실이라 데이터가 소유한다.
# 판정은 키 이름의 부분 문자열이다. 소문자로 맞춘 뒤 본다.
#
# 가리는 쪽으로 기운 목록이다. 가리지 않아야 할 값을 가리면 위키가 덜 말하지만, 가려야 할
# 값을 안 가리면 위키가 비밀을 퍼뜨린다. 두 실수의 값이 다르다.
key_markers:
  - password
  - passwd
  - secret
  - token
  - credential
  - private_key
  - privatekey
  - apikey
  - api_key
  - access_key
  - accesskey
  - client_secret
  - auth
  - session_key
  - encryption
  - signing
  - salt
  - passphrase
# 값 자체가 비밀로 보이는 모양. 키 이름이 무해해도 값이 이 모양이면 가린다.
value_prefixes:
  - "ghp_"
  - "github_pat_"
  - "xoxb-"
  - "xoxp-"
  - "sk-"
  - "AKIA"
  - "-----BEGIN"
  - "eyJ"
# 가린 자리에 넣는 표기. 값이 있었다는 사실은 남기고 값은 남기지 않는다.
redaction: "(가려짐)"
