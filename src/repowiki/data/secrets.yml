# 값을 가려야 하는 설정 키(SPEC 자격 증명 마스킹). 도메인 사실이라 데이터가 소유한다.
# 판정은 키 이름의 부분 문자열이다. 소문자로 맞춘 뒤 본다.
#
# 가리는 쪽으로 기운 목록이다. 가리지 않아야 할 값을 가리면 위키가 덜 말하지만, 가려야 할
# 값을 안 가리면 위키가 비밀을 퍼뜨린다. 두 실수의 값이 다르다.
key_markers:
  - password
  - passwd
  - secret
  - token
  - credential
  - private_key
  - privatekey
  - apikey
  - api_key
  - access_key
  - accesskey
  - client_secret
  - auth
  - session_key
  - encryption
  - signing
  - salt
  - passphrase
  # Kubernetes 와 Helm 의 자격 증명 자리. 이름에 위의 표시가 없다.
  # 2026-09-10 적대적 리뷰가 `tls.key`와 `privatePem`이 그냥 나가는 것을 재현했다.
  #
  # `.key` 를 넣었다가 뺐다. 부분 문자열이라 너무 많이 잡았다 — 같은 리뷰가
  # `configMap.key`(ConfigMap 안의 키 이름), `keyPath`와 `keyFile`(파일 경로),
  # `source.key`(참조할 자리)까지 가리는 것을 보였다. 그것들은 비밀이 아니라 포인터다.
  # 가리면 위키가 "이 값이 어디서 오는가"를 말하지 못한다.
  # 값이 실제로 비밀이면 아래의 값 모양 규칙과 base64 풀기가 잡는다.
  - tls.key
  - tls.crt
  - pem
  - keystore
  - truststore
# 값 자체가 비밀로 보이는 모양. 키 이름이 무해해도 값이 이 모양이면 가린다.
value_prefixes:
  - "ghp_"
  - "github_pat_"
  - "xoxb-"
  - "xoxp-"
  - "sk-"
  - "AKIA"
  - "-----BEGIN"
  - "eyJ"
# base64 로 감싼 비밀. 겉보기가 평범한 문자열이라 위의 접두어로 안 잡힌다.
# 풀어서 다시 본다 — 푼 결과가 위의 모양이면 가린다. 길이 하한을 두는 것은 짧은 문자열이
# 우연히 base64 로 읽히는 일이 흔하기 때문이다(`admin`도 풀린다).
decode_base64_over: 24
# 가린 자리에 넣는 표기. 값이 있었다는 사실은 남기고 값은 남기지 않는다.
redaction: "(가려짐)"
