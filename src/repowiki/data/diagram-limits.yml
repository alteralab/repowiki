# 다이어그램 한도의 정본(PLAN §2.5). 값은 가독성 사다리 실측으로 정했다.
# 측정: 1440px 뷰포트, 본문 폭 1100px, 실제 Chrome 렌더, 엣지 교차 10개 이하가 기준.
# 실측(evals/ladder): L0를 ELK로 그리면 상한 6에서 kafka 1, dubbo 5, airflow 5로 통과한다.
# 같은 상한을 dagre로 그리면 dubbo 11, airflow 20으로 떨어진다.
# L1도 dagre로는 둘이 떨어졌다(dubbo-metrics 교차 11, airflow providers 17). ELK로 바꾸니
# 각각 5와 3이 되고 나머지도 전부 통과한다(dubbo 17/17, airflow 24/24).
# L2는 classDiagram이라 ELK 레이아웃의 대상이 아니고 dagre로 통과한다.
levels:
  L0:
    max_nodes: 6
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: elk
  L1:
    max_nodes: 25
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: elk
  FLOW:
    # 참가자는 흐름이 지나는 모듈이다. 시퀀스는 세로로 길어지므로 노드보다 홉이 상한이다.
    max_nodes: 8
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: dagre
  TIME:
    # timeline은 기간 수가 곧 노드 수다. 24개월 창이면 분기 여덟에서 아홉이다.
    max_nodes: 12
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: dagre
  ER:
    # 엔티티 상자는 속성까지 그려 넓다. 한 그림에 열 개가 상한이다.
    max_nodes: 10
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: dagre
  L2:
    max_nodes: 25
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: dagre
  AREA:
    # 1단 구성도. 자식 상자 안에 대표 타입이 들어가 노드가 많아 보이지만, 사람이 보는 것은
    # 상자 사이의 화살표다.
    max_nodes: 12
    max_source_chars: 2600
    max_blocks_per_page: 50
    layout: elk
  TYPE:
    # 한 타입의 상세. 상자 하나에 멤버가 들어가고 이웃이 둘러선다. classDiagram이라 dagre다.
    max_nodes: 25
    max_source_chars: 2400
    max_blocks_per_page: 50
    layout: dagre
  COLLAB:
    # 한 타입이 어디에 기대는지. 중심에서 뻗는 별 모양이라 교차가 적고 상한이 넉넉하다.
    max_nodes: 20
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: elk
  SEQ:
    # 멤버 하나의 호출 순서. 참가자는 타입이고 세로로 길어지므로 참가자 수가 상한이다.
    max_nodes: 8
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: dagre
# 페이지 종류마다 실을 도식과 표의 예산. 한 상한을 모든 쪽에 물리면 안 된다 — 쪽마다
# 성격이 다르다. 구조 개요는 저장소 전체를 여러 각도에서 보여야 하고, 버전 표만 있는
# 쪽에는 그릴 것이 없다.
pages:
  architecture-overview:
    max_diagrams: 8
    target_words: 900
  area:
    # 1단 쪽. 자식을 소개하고 그 아래가 어떻게 나뉘는지 한 장으로 보인다.
    max_diagrams: 4
    target_words: 700
  concept:
    max_diagrams: 5
    target_words: 800
  subsystem:
    max_diagrams: 6
    target_words: 700
  module:
    max_diagrams: 4
    target_words: 700
  flows:
    max_diagrams: 8
    target_words: 600
  history:
    max_diagrams: 3
    target_words: 500
  data-model:
    max_diagrams: 3
    target_words: 500
  quality:
    max_diagrams: 2
    target_words: 500
  usage:
    max_diagrams: 2
    target_words: 500
  stack:
    max_diagrams: 0
    target_words: 400
