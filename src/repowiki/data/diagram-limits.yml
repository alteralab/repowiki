# 다이어그램 한도의 정본(PLAN §2.5). 값은 가독성 사다리 실측으로 정했다.
# 측정: 1440px 뷰포트, 본문 폭 1100px, 실제 Chrome 렌더, 엣지 교차 10개 이하가 기준.
# 실측(evals/ladder): L0를 ELK로 그리면 상한 6에서 kafka 1, dubbo 5, airflow 5로 통과한다.
# 같은 상한을 dagre로 그리면 dubbo 11, airflow 20으로 떨어진다.
# L1도 dagre로는 둘이 떨어졌다(dubbo-metrics 교차 11, airflow providers 17). ELK로 바꾸니
# 각각 5와 3이 되고 나머지도 전부 통과한다(dubbo 17/17, airflow 24/24).
# L2는 classDiagram이라 ELK 레이아웃의 대상이 아니고 dagre로 통과한다.
levels:
  L0:
    max_nodes: 6
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: elk
  L1:
    max_nodes: 25
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: elk
  FLOW:
    # 참가자는 흐름이 지나는 모듈이다. 시퀀스는 세로로 길어지므로 노드보다 홉이 상한이다.
    max_nodes: 8
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: dagre
  TIME:
    # timeline은 기간 수가 곧 노드 수다. 24개월 창이면 분기 여덟에서 아홉이다.
    max_nodes: 12
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: dagre
  ER:
    # 엔티티 상자는 속성까지 그려 넓다. 한 그림에 열 개가 상한이다.
    max_nodes: 10
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: dagre
  L2:
    max_nodes: 25
    max_source_chars: 2000
    max_blocks_per_page: 50
    layout: dagre
